version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collabagent
      POSTGRES_PASSWORD: collabagent_dev
      POSTGRES_DB: collabagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  valkey:
    # Valkey 是 Redis 的 Linux 基金会 fork（BSD 协议），wire protocol 兼容，
    # ioredis 客户端无需更换；URL scheme 沿用 redis://（ioredis 只解析 redis/rediss scheme）。
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://collabagent:collabagent_dev@postgres:5432/collabagent
      VALKEY_URL: redis://valkey:6379
      JWT_SECRET: dev-secret-change-in-production
      PORT: 3001
    depends_on:
      - postgres
      - valkey
    volumes:
      - ./packages:/app/packages
      - ./node_modules:/app/node_modules

  # O4 对象存储（可选）：minio 挂在 profiles: ["s3"] 下，默认 docker compose up 不会启动它。
  # 用法：docker compose --profile s3 up -d minio（控制台 http://localhost:9001，账号 slockadmin/slockadmin123）。
  # 服务端切到对象存储：STORAGE_BACKEND=s3 S3_ENDPOINT=http://localhost:9000 S3_BUCKET=<bucket> ... 启动。
  minio:
    image: minio/minio
    profiles: ["s3"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: slockadmin
      MINIO_ROOT_PASSWORD: slockadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data/

volumes:
  pgdata:
  minio-data:
