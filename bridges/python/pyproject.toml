[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slock-runtime"
version = "0.1.0"
description = "Slock Agent Runtime Protocol (SARP/1) Python worker SDK — LangChain/LangGraph bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # 核心零依赖；langchain/langgraph 由 worker 自行声明

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
langgraph = ["langgraph>=0.2", "langgraph-checkpoint-sqlite>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["slock_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: 需要真实 langchain/langgraph 依赖的集成用例（CI）",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
