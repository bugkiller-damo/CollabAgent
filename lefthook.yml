# O17：提交前自动格式化 + lint 修复；推送前全量 typecheck。
# 安装：pnpm install 后自动执行（postinstall -> lefthook install）。
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,cjs,mjs,ts,tsx,jsx,json,vue}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    # O20：敏感文件/密钥拦截（文件名黑名单 + sk_token/PEM 内容扫描）
    sensitive-files:
      run: node scripts/check-sensitive-files.mjs {staged_files}

pre-push:
  commands:
    typecheck:
      run: pnpm -r typecheck
