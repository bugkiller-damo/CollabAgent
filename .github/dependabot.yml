version: 2

updates:
  # pnpm monorepo — Dependabot supports pnpm workspaces via the root lockfile
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Merge all minor + patch updates into a single PR
      minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Major updates stay as separate PRs for careful review
      major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major

  # Keep GitHub Actions versions fresh
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
