name: Security Audit

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking: fails the job on high/critical vulnerabilities in prod deps
      - name: Audit production dependencies (high severity and above)
        run: pnpm audit --prod --audit-level=high

      # Non-blocking: moderate+ report across all deps, for reference only
      - name: Audit all dependencies (moderate severity, informational)
        continue-on-error: true
        run: pnpm audit --audit-level=moderate || true
